<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Helper - 3D Walkthrough</title>
<style>
:root{--g:#14573f;--g2:#0e3f2d;--cr:#fdf3e1;--cr2:#f3e6c8;--y:#f2c94c;--tx:#1d2b24;--mu:#5d6b63;--bg:#cfe3c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10261c}}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{background:var(--cr);border-radius:16px;box-shadow:0 8px 28px rgba(20,60,40,.25);color:var(--tx)}
#cap{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:12px 26px;text-align:center;min-width:250px;max-width:92vw;transition:opacity .3s}
#cap h1{margin:0;font:700 22px Georgia,serif;color:var(--g)}
#cap p{margin:2px 0 0;color:var(--mu);font-size:13px}
#skip{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);border:0;background:var(--cr);padding:8px 18px;border-radius:99px;cursor:pointer;font-weight:700;color:var(--g);box-shadow:0 4px 14px rgba(0,0,0,.18);transition:opacity .3s}
#skip[hidden]{display:none}
#nav{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 110px);overflow:auto}
#nav button{border:2px solid transparent;background:var(--cr);padding:5px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--g);text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.15);transition:.2s}
#nav button:hover{border-color:var(--y)}#nav button.on{background:var(--g);color:#fff}
#bot{position:fixed;right:14px;bottom:14px;width:330px;padding:10px;z-index:3}
#br{font-size:13px;color:var(--mu);max-height:64px;overflow:auto;margin-bottom:8px}
#bot .row{display:flex;gap:6px}
#bot input{flex:1;min-width:0;border:1px solid #d6c79f;border-radius:10px;padding:8px;background:#fff;font:inherit}
#bot button{border:0;background:var(--g);color:#fff;border-radius:10px;width:38px;cursor:pointer}
#bm.rec{background:#d64545}#bot button:disabled{opacity:.4}
#v360{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;display:none;background:#0b1d14}
#v360.on{display:block}
#n360{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;padding:8px 16px;display:none;font-size:13px;white-space:nowrap}
#v360.on~#n360{display:block}
#cap,#nav,#skip{z-index:2}
#n360 a{color:var(--g);font-weight:700}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
#panel{position:fixed;right:14px;top:84px;bottom:140px;width:340px;z-index:4;padding:18px;overflow:auto;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel h2{margin:0 0 2px;font:700 22px Georgia,serif;color:var(--g)}
#panel .sub{color:var(--mu);margin:0 0 12px}
.box{background:var(--cr2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.box b{display:block;color:var(--g)}
.btn{border:0;background:var(--g);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--g2)}.btn.y{background:var(--y);color:#3b2f00}
.btn.s{background:var(--cr2);color:var(--g);margin-bottom:10px}
select,textarea{width:100%;border:1px solid #d6c79f;border-radius:10px;padding:8px;background:#fff;font:inherit;margin:4px 0 8px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--y);color:#3b2f00}
.chip.a{background:#bfe3ff}.chip.p{background:#bfeccc}
.x{float:right;border:0;background:none;font-size:20px;cursor:pointer;color:var(--mu)}
.fx div{margin-top:4px;font-size:13px}.src{font-size:11px;color:var(--mu)}
@media (max-width:760px){
  #nav{top:auto;bottom:100px;left:8px;right:8px;max-height:96px;overflow:auto;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center}
  #nav button{padding:6px 10px}
  #panel{top:auto;left:8px;right:8px;bottom:100px;width:auto;height:44%;transform:translateY(130%)}
  #bot{left:8px;right:8px;width:auto;bottom:8px}
  #skip{bottom:150px}
  #panel.open{transform:none}
  #cap h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<iframe id="v360" title="Kalinga University original 360 virtual tour" allow="fullscreen; xr-spatial-tracking; accelerometer; gyroscope; autoplay" allowfullscreen></iframe>
<div id="n360" class="card">Original Kalinga 360&deg; tour. Blank? Try
  <button class="btn s" style="margin:0;padding:3px 10px" onclick="src360(1)">Source 1</button>
  <button class="btn s" style="margin:0;padding:3px 10px" onclick="src360(2)">Source 2</button>
  or <a href="https://virtualtour.kalingauniversity.ac.in/" target="_blank" rel="noopener">open in new tab</a>
</div>
<div id="cap" class="card"><h1 id="t">Welcome to the campus</h1><p id="s">Walking to Reception...</p></div>
<nav id="nav" aria-label="Destinations"></nav>
<button id="skip">Skip animation &#8250;</button>
<aside id="panel" class="card" aria-live="polite"></aside>
<div id="bot" class="card">
  <div id="br"></div>
  <div class="row">
    <button id="bm" aria-label="Speak">&#127908;</button>
    <input id="bi" placeholder="Ask: mess kahan hai?" aria-label="Ask CampusBot">
    <button id="bs" aria-label="Send">&#10148;</button>
  </div>
</div>
